<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Three.js Demo</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: #0b1020;
        color: #fff;
      }

      #info {
        position: fixed;
        top: 16px;
        left: 16px;
        z-index: 10;
        padding: 10px 14px;
        background: rgba(0, 0, 0, 0.45);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <div id="info">Three.js 3D canvas demo</div>
    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.160.1/build/three.module.js';

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1020);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2, 8);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      document.body.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 1.6);
      directionalLight.position.set(4, 8, 6);
      scene.add(directionalLight);

      const geometry = new THREE.BoxGeometry(2, 2, 2);
      const material = new THREE.MeshStandardMaterial({ color: 0x4cc9f0, metalness: 0.15, roughness: 0.4 });
      const cube = new THREE.Mesh(geometry, material);
      scene.add(cube);

      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(2.4, 0.12, 16, 120),
        new THREE.MeshStandardMaterial({ color: 0xf72585, emissive: 0x2d0a1a })
      );
      ring.rotation.x = Math.PI / 2.3;
      scene.add(ring);

      function animate() {
        requestAnimationFrame(animate);
        cube.rotation.x += 0.01;
        cube.rotation.y += 0.015;
        ring.rotation.z += 0.008;
        renderer.render(scene, camera);
      }

      animate();

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
